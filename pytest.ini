[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    --color=yes

markers =
    unit: Pure unit tests (no DB)
    integration: Tests that need DB
    slow: Slow tests

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
